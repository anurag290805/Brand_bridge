<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Typography: Cormorant Garamond (elegant serif display),
         DM Sans (modern sans), JetBrains Mono (technical detail). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Primary SEO -->
    <title>BrandBridge · Connecting creators with the right brand opportunities</title>
    <meta
      name="description"
      content="BrandBridge connects Instagram creators with relevant brand collaboration opportunities. A focused bridge between the audiences creators build and the brands that want to reach them."
    />
    <meta name="robots" content="index, follow" />
    <!-- Canonical: replace {site-url} in src/config.ts before deploy -->
    <link rel="canonical" href="https://brandbridge.example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BrandBridge" />
    <meta property="og:title" content="BrandBridge · Creator x Brand collaborations" />
    <meta
      property="og:description"
      content="BrandBridge connects creators with relevant brand collaboration opportunities. Turn your audience into meaningful partnerships."
    />
    <meta property="og:url" content="https://brandbridge.example.com/" />
    <meta property="og:image" content="https://brandbridge.example.com/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BrandBridge · Creator x Brand collaborations" />
    <meta
      name="twitter:description"
      content="BrandBridge connects creators with relevant brand collaboration opportunities."
    />
    <meta name="twitter:image" content="https://brandbridge.example.com/og-image.png" />

    <!-- Theme: dark-first, with a light-mode variant for the browser chrome -->
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf7f1" media="(prefers-color-scheme: light)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
